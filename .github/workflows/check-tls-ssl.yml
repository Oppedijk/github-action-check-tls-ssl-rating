name: Nightly TLS/SSL Check

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  check-tls-ssl:
    runs-on: ubuntu-latest
    name: Check TLS/SSL Ratings
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check Website for TLS/SSL rating
        uses: ./
        with:
          url: 'www.oppedijk.com'
          port: '443'
          required-rating: 'A'
